# Publishes firestore.rules to Firebase automatically whenever it changes on main.
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT (the JSON key of a Firebase service account).
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - .github/scripts/deploy-rules.cjs
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the Firebase key is set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (Settings → Secrets and variables → Actions). See README → 'Automatic rules deploy'."
            exit 1
          fi

      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-audit --no-fund firebase-admin@13.10.0

      - name: Publish rules to Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/deploy-rules.cjs
