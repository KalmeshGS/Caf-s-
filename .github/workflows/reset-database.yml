# DANGER: erases ALL café data and ALL login accounts in Firebase (fresh start).
# Manual only: Actions → "Reset database" → Run workflow → type DELETE EVERYTHING.
# Security rules are not touched.
name: Reset database (deletes everything)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE EVERYTHING to erase all café data and all accounts'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: reset-database
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DELETE EVERYTHING" ]; then
            echo "::error::Type exactly DELETE EVERYTHING to run the reset. Nothing was deleted."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-audit --no-fund firebase-admin@13.10.0

      - name: Erase database and accounts
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CONFIRM: ${{ inputs.confirm }}
        run: node .github/scripts/reset-database.cjs
