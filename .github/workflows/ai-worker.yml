# Publishes the Cafe Journal AI helper (worker/) to Cloudflare whenever it changes on main,
# or when you run it by hand (Actions → "Deploy AI helper" → Run workflow).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. The AI itself is Cloudflare's free Workers AI.
name: Deploy AI helper

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/ai-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      # raw values; spaces or blank lines pasted by mistake are removed before use
      CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets are set
        id: check
        run: |
          missing=""
          [ -n "$(printf %s "$CF_TOKEN_RAW" | tr -d '[:space:]')" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$(printf %s "$CF_ACCOUNT_RAW" | tr -d '[:space:]')" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice::AI helper not deployed — add these repository secrets first:$missing (see worker/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Deploy the worker
        if: steps.check.outputs.ready == 'true'
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf %s "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf %s "$CF_ACCOUNT_RAW" | tr -d '[:space:]' | sed 's#.*dash.cloudflare.com/##; s#/.*##')"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"; echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy
