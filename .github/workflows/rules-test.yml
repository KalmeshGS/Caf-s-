# Security rules check: every staff role (owner, manager, cashier, waiter, captain, kitchen,
# housekeeping, a locked account, another café's owner, signed-out visitor) against firestore.rules.
# Runs on the Firebase rules emulator — never touches the real database.
name: Security rules test

on:
  push:
    branches: [main]
    paths: [firestore.rules, tests/**, .github/workflows/rules-test.yml]
  pull_request:
    paths: [firestore.rules, tests/**, .github/workflows/rules-test.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: tests
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Every role against the rules
        working-directory: tests
        run: npx --yes firebase-tools@15.37.0 emulators:exec --project demo-cafe --only firestore "node rules.test.mjs"
