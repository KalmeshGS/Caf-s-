# Cafe Journal AI helper (Cloudflare Worker). Deployed by .github/workflows/ai-worker.yml
name = "cafe-journal-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Cloudflare's built-in AI (Workers AI) — free daily allowance, no AI key needed
[ai]
binding = "AI"

[vars]
# Only the website may call this helper
ALLOWED_ORIGIN = "https://kalmeshgs.github.io"
# Firebase project: only people logged in to a café can use it
FIREBASE_PROJECT_ID = "cafe-journal-9ba5e"
# Free Workers AI models
RECIPE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
