<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cafe Journal</title>
  <meta name="description" content="A calm daybook for cafés, restaurants and hotels — orders, kitchen, billing, stock, expenses, vendors, staff and reports.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151311" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cafe Journal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app"><noscript>Cafe Journal needs JavaScript enabled.</noscript></div>
  <div id="sheet" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print" aria-hidden="true"></div>
  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/views.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
